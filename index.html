<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mediclaim Addition Request</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #f4f7fb;
    --surface: #ffffff;
    --surface-2: #eef2f8;
    --border: #dde4ee;
    --text: #16324e;
    --text-muted: #5f6f85;
    --navy: #204768;
    --navy-deep: #16324e;
    --gold: #b6910f;
    --gold-soft: #fdf6da;
    --gold-border: #ecd98f;
    --success: #147a3d;
    --success-bg: #eaf6ee;
    --error: #b3261e;
    --error-bg: #fbebea;
    --focus-ring: rgba(32, 71, 104, 0.28);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101b26;
      --surface: #16232f;
      --surface-2: #1c2b3a;
      --border: #2b3c4d;
      --text: #e7edf3;
      --text-muted: #93a2b4;
      --navy: #3e6f96;
      --navy-deep: #9fc4e0;
      --gold: #d8b94a;
      --gold-soft: #2a2415;
      --gold-border: #55461c;
      --success: #4cbf7a;
      --success-bg: #12291d;
      --error: #e0796f;
      --error-bg: #2e1917;
      --focus-ring: rgba(158, 196, 224, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #101b26;
    --surface: #16232f;
    --surface-2: #1c2b3a;
    --border: #2b3c4d;
    --text: #e7edf3;
    --text-muted: #93a2b4;
    --navy: #3e6f96;
    --navy-deep: #9fc4e0;
    --gold: #d8b94a;
    --gold-soft: #2a2415;
    --gold-border: #55461c;
    --success: #4cbf7a;
    --success-bg: #12291d;
    --error: #e0796f;
    --error-bg: #2e1917;
    --focus-ring: rgba(158, 196, 224, 0.35);
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Inter", Arial, Helvetica, sans-serif;
    background: var(--bg);
    margin: 0;
    padding-block: 28px;
    padding-inline: 16px;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .brand {
    max-width: 480px;
    margin: 0 auto 18px auto;
    display: flex;
    justify-content: center;
  }
  .brand-plate {
    background: #ffffff;
    padding: 10px 20px;
    border-radius: 10px;
    box-shadow: 0 1px 2px rgba(16,27,38,0.04), 0 8px 24px rgba(16,27,38,0.06);
  }
  .brand img {
    height: 46px;
    width: auto;
    display: block;
  }
  .card {
    max-width: 480px;
    margin: 0 auto 16px auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 1px 2px rgba(16,27,38,0.04), 0 8px 24px rgba(16,27,38,0.06);
    padding: 24px;
  }
  h1 {
    font-family: "Manrope", sans-serif;
    font-weight: 800;
    font-size: 21px;
    margin: 0 0 6px 0;
    color: var(--text);
    text-wrap: balance;
  }
  .subtitle { font-size: 13px; line-height: 1.5; color: var(--text-muted); margin-bottom: 20px; }
  .member-block { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border); }
  .member-block:first-of-type { margin-top: 20px; padding-top: 0; border-top: none; }
  .member-block h2 {
    font-family: "Manrope", sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.02em;
    margin: 0 0 12px 0;
    color: var(--navy);
  }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin: 12px 0 5px 0; }
  select, input[type="text"], input[type="date"] {
    width: 100%;
    padding: 10px 11px;
    font-size: 14.5px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  select:focus, input:focus {
    outline: none;
    border-color: var(--navy);
    box-shadow: 0 0 0 3px var(--focus-ring);
  }
  .readonly {
    background: var(--surface-2);
    color: var(--text);
    padding: 10px 11px;
    border-radius: 8px;
    font-size: 14.5px;
    border: 1px solid var(--border);
    min-height: 20px;
  }
  .note {
    display: none;
    margin-top: 10px;
    background: var(--gold-soft);
    border: 1px solid var(--gold-border);
    color: var(--gold);
    font-size: 12.5px;
    line-height: 1.5;
    padding: 10px 12px;
    border-radius: 8px;
  }
  .note.show { display: block; }
  .combo { position: relative; }
  .combo-list {
    position: absolute;
    z-index: 20;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    max-height: 220px;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(16,27,38,0.16);
    display: none;
  }
  .combo-list.show { display: block; }
  .combo-item { padding: 10px 12px; font-size: 14px; cursor: pointer; }
  .combo-item:hover { background: var(--surface-2); }
  .combo-empty { padding: 10px 12px; font-size: 13px; color: var(--text-muted); }
  .remove-btn {
    float: right;
    font-size: 12px;
    font-weight: 600;
    color: var(--error);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
  }
  .add-btn, .submit-btn {
    width: 100%;
    padding: 11px;
    font-size: 14px;
    font-weight: 700;
    font-family: "Manrope", sans-serif;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    margin-top: 14px;
    transition: filter .15s ease;
  }
  .add-btn:hover, .submit-btn:hover:not(:disabled) { filter: brightness(1.06); }
  .add-btn { background: var(--surface-2); color: var(--navy); border: 1px dashed var(--navy); }
  .submit-btn { background: var(--navy); color: #fff; margin-top: 20px; }
  .submit-btn:disabled { background: var(--text-muted); cursor: default; }
  #statusMsg { text-align: center; font-size: 13px; margin-top: 12px; padding: 8px; border-radius: 8px; }
  #statusMsg.ok { color: var(--success); background: var(--success-bg); }
  #statusMsg.err { color: var(--error); background: var(--error-bg); }
</style>
</head>

  var memberIndex = 0;

  function firstOfMonthIST() {
    var now = new Date();
    var ist = new Date(now.toLocaleString("en-US", { timeZone: "Asia/Kolkata" }));
    var first = new Date(ist.getFullYear(), ist.getMonth(), 1);
    var dd = String(first.getDate()).padStart(2, "0");
    var mm = String(first.getMonth() + 1).padStart(2, "0");
    return dd + "-" + mm + "-" + first.getFullYear();
  }
  FORM_DATA.additionDate = firstOfMonthIST();

  function init() {
    var companySel = document.getElementById("company");
    FORM_DATA.companies.forEach(function (c) {
      var opt = document.createElement("option");
      opt.value = c;
      opt.textContent = c;
      companySel.appendChild(opt);
    });

    setupEmpIdCombo();

    document.getElementById("addMemberBtn").addEventListener("click", function () { addMemberBlock(false); });
    document.getElementById("mainForm").addEventListener("submit", onSubmit);

    addMemberBlock(true);
  }

  function setupEmpIdCombo() {
    var input = document.getElementById("empIdSearch");
    var hidden = document.getElementById("empId");
    var list = document.getElementById("empIdList");

    function renderList(filterText) {
      var q = (filterText || "").trim().toLowerCase();
      var all = FORM_DATA.employees;
      var matches = !q ? all.slice(0, 50) : all.filter(function (e) {
        return e.empId.toLowerCase().indexOf(q) !== -1 || e.fullName.toLowerCase().indexOf(q) !== -1;
      }).slice(0, 50);

      list.innerHTML = "";
      if (!matches.length) {
        var empty = document.createElement("div");
        empty.className = "combo-empty";
        empty.textContent = "No matching Emp ID found.";
        list.appendChild(empty);
      } else {
        matches.forEach(function (e) {
          var item = document.createElement("div");
          item.className = "combo-item";
          item.textContent = e.empId + " - " + e.fullName;
          item.addEventListener("mousedown", function (ev) {
            ev.preventDefault();
            hidden.value = e.empId;
            input.value = e.empId + " - " + e.fullName;
            list.classList.remove("show");
            onEmpIdChange();
          });
          list.appendChild(item);
        });
      }
      list.classList.add("show");
    }

    input.addEventListener("focus", function () { renderList(input.value); });
    input.addEventListener("input", function () {
      hidden.value = "";
      document.getElementById("empFullName").textContent = "-";
      updatePrimaryFullName("-");
      renderList(input.value);
    });
    document.addEventListener("click", function (e) {
      if (!e.target.closest(".combo")) list.classList.remove("show");
    });
  }

  function onEmpIdChange() {
    var empId = document.getElementById("empId").value;
    var emp = FORM_DATA.employees.find(function (e) { return e.empId === empId; });
    var name = emp ? emp.fullName : "-";
    document.getElementById("empFullName").textContent = name;
    updatePrimaryFullName(name);
  }

  function updatePrimaryFullName(name) {
    var primaryNameField = document.querySelector(".member-block[data-primary='true'] .full-name-readonly");
    if (primaryNameField) primaryNameField.textContent = name;
  }

  function addMemberBlock(isPrimary) {
    memberIndex++;
    var idx = memberIndex;
    var container = document.getElementById("membersContainer");

    var block = document.createElement("div");
    block.className = "member-block";
    block.dataset.index = idx;
    if (isPrimary) block.dataset.primary = "true";

    var titleText = isPrimary ? "Your Details" : "Family Member";
    var removeBtn = isPrimary ? "" : ('<button type="button" class="remove-btn" onclick="removeBlock(' + idx + ')">Remove</button>');

    var nameFieldHtml = isPrimary
      ? '<div class="readonly full-name-readonly">-</div>'
      : '<input type="text" class="full-name-input" placeholder="Family member&#39;s full name" required>';

    block.innerHTML =
      "<h2>" + titleText + removeBtn + "</h2>" +
      "<label>Full Name</label>" + nameFieldHtml +
      "<label>Addition Date</label>" +
      ('<div class="readonly addition-date">' + FORM_DATA.additionDate + "</div>") +
      "<label>Date of Birth</label>" +
      '<input type="date" class="dob-input" required>' +
      "<label>Gender</label>" +
      '<select class="gender-select" required>' +
        '<option value="">Select...</option>' +
        FORM_DATA.genders.map(function (g) { return '<option value="' + g + '">' + g + "</option>"; }).join("") +
      "</select>" +
      "<label>Relationship</label>" +
      '<select class="relationship-select" required>' +
        '<option value="">Select...</option>' +
        FORM_DATA.relationships.map(function (r) {
          var sel = (isPrimary && r === "Self") ? " selected" : "";
          return '<option value="' + r + '"' + sel + ">" + r + "</option>";
        }).join("") +
      "</select>" +
      '<div class="note">To add your parents, you need to pay half the premium amount yourself, and the other half will be covered by the company.</div>';

    container.appendChild(block);

    var relSelect = block.querySelector(".relationship-select");
    var noteDiv = block.querySelector(".note");
    relSelect.addEventListener("change", function () {
      var v = relSelect.value.toLowerCase();
      noteDiv.classList.toggle("show", v === "father" || v === "mother");
    });
    relSelect.dispatchEvent(new Event("change"));
  }

  function removeBlock(idx) {
    var block = document.querySelector('.member-block[data-index="' + idx + '"]');
    if (block) block.remove();
  }

  function formatDobForSheet(isoDate) {
    if (!isoDate) return "";
    var parts = isoDate.split("-");
    return parts[2] + "-" + parts[1] + "-" + parts[0];
  }

  function onSubmit(e) {
    e.preventDefault();
    var statusMsg = document.getElementById("statusMsg");
    statusMsg.className = "";
    statusMsg.textContent = "";

    var company = document.getElementById("company").value;
    var empId = document.getElementById("empId").value;
    if (!company || !empId) {
      statusMsg.className = "err";
      statusMsg.textContent = "Please select Company and Emp ID.";
      return;
    }

    var blocks = document.querySelectorAll(".member-block");
    var members = [];
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      var isPrimary = b.dataset.primary === "true";
      var fullName = isPrimary
        ? b.querySelector(".full-name-readonly").textContent
        : b.querySelector(".full-name-input").value.trim();
      var dob = b.querySelector(".dob-input").value;
      var gender = b.querySelector(".gender-select").value;
      var relationship = b.querySelector(".relationship-select").value;

      if (!fullName || fullName === "-" || !dob || !gender || !relationship) {
        statusMsg.className = "err";
        statusMsg.textContent = "Please complete every field for each member before submitting.";
        return;
      }
      members.push({
        fullName: fullName,
        dob: formatDobForSheet(dob),
        gender: gender,
        relationship: relationship
      });
    }

    var submitBtn = document.getElementById("submitBtn");
    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting...";

    var payload = {
      company: company,
      empId: empId,
      additionDate: FORM_DATA.additionDate,
      members: members
    };

    // Sent as a GET (the reverse proxy in front of this app only forwards
    // GET requests to "/"), with the payload base64-encoded in a request
    // header rather than the URL, so it doesn't land in browser history or
    // access logs.
    function utf8ToBase64(str) {
      return btoa(unescape(encodeURIComponent(str)));
    }

    fetch("/", { headers: { "X-Mediclaim-Submit": utf8ToBase64(JSON.stringify(payload)) } })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (result) {
        if (result.ok && result.data.ok) {
          statusMsg.className = "ok";
          statusMsg.textContent = "Submitted successfully -- " + members.length + " member(s) added for processing.";
          submitBtn.textContent = "Submitted";
        } else {
          statusMsg.className = "err";
          statusMsg.textContent = "Submission failed: " + (result.data.error || "please try again or contact HR.");
          submitBtn.disabled = false;
          submitBtn.textContent = "Submit";
        }
      })
      .catch(function () {
        statusMsg.className = "err";
        statusMsg.textContent = "Could not reach the server. Please check your connection and try again.";
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit";
      });
  }

  init();
</script>
